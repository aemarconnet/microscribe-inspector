name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the app and tools with the .NET Framework compiler built into Windows,
      # runs the self-tests and assembles the portable zip.
      - name: Build, test and package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\package.ps1

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: MicroScribeInspector-portable
          path: dist/*.zip
